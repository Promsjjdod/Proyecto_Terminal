[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-terminal"
version = "0.1.0"
description = "NEXO TERMINAL — Agente de IA multimodelo para terminal, optimizado para Termux en Android."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Proyecto_Terminal" }]
keywords = ["termux", "android", "terminal", "agente", "ia", "llm"]
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nexo = "nexo.cli:main"

[tool.setuptools.packages.find]
include = ["nexo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
